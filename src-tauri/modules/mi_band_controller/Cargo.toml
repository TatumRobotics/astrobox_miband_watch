[package]
name = "mi_band_controller"
version = "0.1.0"
edition = "2024"

[dependencies]
corelib = { path = "../core" }
pb = { path = "../pb" }
btclassic-spp = { path = "../../plugins/btclassic-spp" }
tokio = { version = "1.48.0", features = ["full"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

[[bin]]
name = "mi_band_controller"
path = "src/main.rs"
