logging:
  default: Information
  # Safety switch: if true AND your log level for protocol/auth/device is set to Trace,
  # the app may emit raw packet bytes and other sensitive details to the console.
  # Keep this false in normal operation.
  diagnostic_mode: false
  filters:
    Protocol.CryptographyHelper: Warning
    Protocol.PacketBuffer: Warning
    Protocol.PacketFraming: Warning
    Protocol.PacketProcessor: Warning
    Authentication.AuthenticationHandler: Warning
    Bluetooth.BluetoothSppClient: Warning
    Bluetooth.RfcommSocketManager: Warning
    Bluetooth.BlueZDeviceManager: Warning
    Program: Information

# Background monitor: checks battery periodically and (optionally) vibrates when low.
battery_monitoring:
  enabled: true
  # LOW_BATTERY_THRESHOLD (percent 0-100)
  low_battery_threshold: 20
  # Required behavior: check every 6 hours.
  check_interval_hours: 6
  # Required behavior: notify every 30 minutes while low + not charging.
  notify_interval_minutes: 30
  # While in low-battery notification mode, poll charging state this often so we stop immediately.
  charging_poll_seconds: 60
  # A pattern name from `patterns:` to play when low battery is detected.
  low_battery_pattern: "sos"

# there's a couple example patterns here
# we should improve them and define specific ones for
# phone calls, notifications, sms messages, etc.
patterns:
# note: from testing with Elane, we found that it's difficult for her to feel the vibrations,
# so these strength=100 ones are possibly the only viable way for her to get important notifications.
# but a per-user "pattern strength" in the database for the patterns would be the best option for this in the future.
  strongest:
  - on: true
    duration: 3000
    strength: 100
